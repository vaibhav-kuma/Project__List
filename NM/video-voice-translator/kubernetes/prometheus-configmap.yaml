apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'backend'
        static_configs:
          - targets: ['backend-service:8000']
      - job_name: 'frontend'
        static_configs:
          - targets: ['frontend-service:80']
      - job_name: 'worker'
        static_configs:
          - targets: ['worker-service:8000']  # Assuming worker exposes metrics
