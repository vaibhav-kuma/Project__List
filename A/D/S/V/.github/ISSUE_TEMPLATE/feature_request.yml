name: Feature Request
description: Suggest an idea for this project
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - auth
        - video
        - matching
        - moderation
        - admin
        - payment
        - safety
        - mobile
        - other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add mockups, diagrams, or references
