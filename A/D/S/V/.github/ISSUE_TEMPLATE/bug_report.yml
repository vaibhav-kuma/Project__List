name: Bug Report
description: Report a bug to help us improve
title: "[bug] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (app broken)
        - High (feature broken)
        - Medium (minor issue)
        - Low (cosmetic)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: |
        Examples:
        - OS: Windows 11 / macOS 14 / Ubuntu 22.04
        - Browser: Chrome 124 / Safari 17 / Firefox 125
        - App: PWA / Web / iOS / Android
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Copy any relevant console or network logs
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Videos
      description: If applicable, add screenshots or video recordings
