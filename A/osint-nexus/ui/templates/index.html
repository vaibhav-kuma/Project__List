<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Nexus Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e17; color: #c9d1d9; min-height: 100vh; }
        
        .navbar { background: #161b22; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #30363d; }
        .navbar h1 { color: #58a6ff; font-size: 1.5em; }
        .navbar .status { color: #3fb950; font-size: 0.9em; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .search-section { background: #161b22; border-radius: 10px; padding: 30px; margin-bottom: 20px; border: 1px solid #30363d; }
        .search-row { display: flex; gap: 10px; align-items: center; }
        .search-row input { flex: 1; padding: 12px 20px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 1.1em; }
        .search-row input:focus { outline: none; border-color: #58a6ff; }
        .search-row select { padding: 12px 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; }
        .btn-primary { background: #238636; color: white; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #161b22; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #30363d; }
        .stat-card .value { font-size: 2em; font-weight: bold; color: #58a6ff; }
        .stat-card .label { color: #8b949e; margin-top: 5px; font-size: 0.9em; }
        
        .results-section { background: #161b22; border-radius: 10px; border: 1px solid #30363d; }
        .results-header { padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
        .results-header h2 { color: #58a6ff; }
        
        .finding-card { padding: 15px 20px; border-bottom: 1px solid #21262d; }
        .finding-card:hover { background: #1c2128; }
        .finding-card .title { font-weight: 600; margin-bottom: 5px; }
        .finding-card .desc { color: #8b949e; font-size: 0.9em; }
        .finding-card .meta { display: flex; gap: 10px; margin-top: 8px; }
        
        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75em; font-weight: 600; }
        .badge-critical { background: rgba(248,81,73,0.15); color: #f85149; }
        .badge-high { background: rgba(219,171,70,0.15); color: #d29922; }
        .badge-medium { background: rgba(187,128,9,0.15); color: #bb8009; }
        .badge-low { background: rgba(88,166,255,0.15); color: #58a6ff; }
        .badge-info { background: rgba(63,185,80,0.15); color: #3fb950; }
        
        .tag { display: inline-block; background: #21262d; color: #58a6ff; padding: 2px 8px; border-radius: 20px; font-size: 0.75em; margin: 2px; }
        
        #loading { display: none; text-align: center; padding: 40px; color: #58a6ff; }
        .spinner { border: 3px solid #30363d; border-top: 3px solid #58a6ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🔱 OSINT Nexus</h1>
        <span class="status">● Online</span>
    </nav>
    
    <div class="container">
        <div class="search-section">
            <h2 style="margin-bottom: 15px; color: #c9d1d9;">New Investigation</h2>
            <div class="search-row">
                <input type="text" id="targetInput" placeholder="Enter target (domain, IP, email, username, phone...)">
                <select id="typeSelect">
                    <option value="">Auto-detect</option>
                    <option value="domain">Domain</option>
                    <option value="ip">IP Address</option>
                    <option value="email">Email</option>
                    <option value="username">Username</option>
                    <option value="phone">Phone</option>
                    <option value="url">URL</option>
                    <option value="hash">Hash</option>
                </select>
                <button class="btn btn-primary" onclick="startScan()">🔍 Investigate</button>
            </div>
        </div>
        
        <div id="stats" class="stats-grid" style="display:none;">
            <div class="stat-card"><div class="value" id="totalFindings">0</div><div class="label">Total Findings</div></div>
            <div class="stat-card"><div class="value" id="criticalCount" style="color:#f85149">0</div><div class="label">Critical</div></div>
            <div class="stat-card"><div class="value" id="highCount" style="color:#d29922">0</div><div class="label">High</div></div>
            <div class="stat-card"><div class="value" id="modulesRun" style="color:#3fb950">0</div><div class="label">Modules</div></div>
            <div class="stat-card"><div class="value" id="duration">0s</div><div class="label">Duration</div></div>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Running OSINT investigation... This may take a few minutes.</p>
        </div>
        
        <div id="results" class="results-section" style="display:none;">
            <div class="results-header">
                <h2>📊 Results</h2>
                <div>
                    <button class="btn btn-secondary" onclick="exportReport('json')">Export JSON</button>
                    <button class="btn btn-secondary" onclick="exportReport('html')">Export HTML</button>
                </div>
            </div>
            <div id="findingsList"></div>
        </div>
    </div>
    
    <script>
        async function startScan() {
            const target = document.getElementById('targetInput').value.trim();
            const type = document.getElementById('typeSelect').value;
            
            if (!target) { alert('Please enter a target'); return; }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            
            try {
                const resp = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target, type })
                });
                
                const data = await resp.json();
                displayResults(data);
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayResults(data) {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('results').style.display = 'block';
            
            document.getElementById('totalFindings').textContent = data.total_findings || 0;
            document.getElementById('modulesRun').textContent = Object.keys(data.results || {}).length;
            
            let critical = 0, high = 0;
            const findingsList = document.getElementById('findingsList');
            findingsList.innerHTML = '';
            
            for (const [moduleName, moduleResult] of Object.entries(data.results || {})) {
                for (const finding of (moduleResult.findings || [])) {
                    if (finding.severity === 'critical') critical++;
                    if (finding.severity === 'high') high++;
                    
                    const card = document.createElement('div');
                    card.className = 'finding-card';
                    card.innerHTML = `
                        <div class="title">
                            <span class="badge badge-${finding.severity}">${finding.severity.toUpperCase()}</span>
                            ${finding.title}
                        </div>
                        <div class="desc">${finding.description}</div>
                        <div class="meta">
                            <span class="tag">${finding.module}</span>
                            ${(finding.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    `;
                    findingsList.appendChild(card);
                }
            }
            
            document.getElementById('criticalCount').textContent = critical;
            document.getElementById('highCount').textContent = high;
        }
    </script>
</body>
</html>
