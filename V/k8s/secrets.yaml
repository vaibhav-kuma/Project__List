apiVersion: v1
kind: Secret
metadata:
  name: ninor-backend-secrets
  namespace: ninor
  labels:
    app: ninor-backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ninor:CHANGEME@ninor-db.cluster-xxxxx.us-east-1.rds.amazonaws.com:5432/ninor"
