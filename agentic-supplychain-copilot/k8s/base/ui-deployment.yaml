apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: agentic/ui:dev
          ports:
            - containerPort: 80
